<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Security Consultation</title>
    <link rel="stylesheet" href="styles.css">
</head>
</html>
<body>
    <nav class="navigation">
        <a href="index.html">Home</a>
        <a href="quiz.html">Quiz</a>
        <a href="result.html">Results</a>
        <a href="security_tips.html">Security Tips</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <h1>Request a Security Consultation</h1>
        <p> Want to request a security consultation? Tell us more about your business and we will reach out regarding your next steps.</p>

        <form method="post" action="https://miswebapps.uncw.edu/mis310/form-submit.aspx">
            <label for="full-name">Your Name</label>
            <input type="text" id="full-name" name ="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone">

            <label for="business-size">Number of Employees</label>
            <select id="business-size" name="business-size">
                <option value="1-10">1-10</option>
                <option value="11-50">11-50</option>
                <option value="51-200">51-100+</option>
            </select>

             <fieldset>
                <legend>How should we contact you?</legend>
                <input type="radio" id="contact" name="contact-method" value="email">
                <label for="contact">Email</label>
                <input type="radio" id="contact" name="contact-method" value="phone">
                <label for="contact">Phone</label>
            </fieldset>

            <fieldset>
                <legend>What would you like your business to improve on? </legend>
                <input type="checkbox" id="network-security" name="improvement" value="network-security">
                <label for="network-security">Network Security</label>
                <input type="checkbox" id="data-protection" name="improvement" value="data-protection">
                <label for="data-protection">Data Protection</label>
                <input type="checkbox" id="employee-training" name="improvement" value="employee-training">
                <label for="employee-training">Employee Training</label>
                <input type="checkbox" id="other" name="improvement" value="other">
                <label for="other">Other</label>
            </fieldset>

            <label for="message">Additional Comments</label>
            <textarea id="message" name="message" rows="4"></textarea>

            <label for="consult-date">Preferred Consultation Date</label>
            <input type="date" id="consult-date" name="consult-date">

            <button type="submit">Submit</button>

        </form>
    </main>
</body>
</html>
